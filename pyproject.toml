[project]
name = "explab"
version = "0.1.0"
description = "Experiment readout engine for the Criteo uplift dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "duckdb",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "statsmodels"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["explab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
